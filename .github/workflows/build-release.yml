name: Build & Release (macOS DMG + Windows EXE + Web)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-web:
    name: Build Offline Web Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Bundle Offline xterm.js
        run: chmod +x scripts/fetch-vendor.sh && ./scripts/fetch-vendor.sh
      - name: Run Unit Tests
        run: go mod tidy && go test -v ./internal/...
      - name: Cross-compile Web Edition
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/ssh-guard-web-darwin-arm64 ./cmd/web
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/ssh-guard-web-windows-amd64.exe ./cmd/web
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/ssh-guard-web-windows-arm64.exe ./cmd/web
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/ssh-guard-web-linux-amd64 ./cmd/web
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-guard-web-binaries
          path: dist/*

  build-desktop-mac:
    name: Build macOS Desktop (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Bundle Offline xterm.js
        run: chmod +x scripts/fetch-vendor.sh scripts/fix-mac-gatekeeper.sh && ./scripts/fetch-vendor.sh
      - name: Install Wails v2 CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build, Sign & Package macOS DMG
        run: |
          go mod tidy
          go test -v ./...
          wails build -skipbindings -clean -platform darwin/arm64
          ./scripts/fix-mac-gatekeeper.sh build/bin/SSH-Guard.app

          mkdir -p dmg-stage release-mac
          ditto build/bin/SSH-Guard.app dmg-stage/SSH-Guard.app
          ln -s /Applications dmg-stage/Applications

          for attempt in 1 2 3; do
            if hdiutil create \
              -volname "SSH-Guard" \
              -srcfolder dmg-stage \
              -ov \
              -format UDZO \
              release-mac/SSH-Guard-macOS-arm64.dmg; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 3
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-guard-desktop-macos-arm64
          path: release-mac/SSH-Guard-macOS-arm64.dmg

  build-desktop-windows:
    name: Build Windows Desktop (.exe + NSIS Installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Bundle Offline xterm.js
        shell: pwsh
        run: .\scripts\fetch-vendor.ps1
      - name: Install Wails v2 CLI & Ensure NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
          $GoBin = Join-Path (go env GOPATH) "bin"
          Add-Content -Path $env:GITHUB_PATH -Value $GoBin

          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $NsisDir = "C:\Program Files (x86)\NSIS"
            if (-not (Test-Path (Join-Path $NsisDir "makensis.exe"))) {
              choco install nsis -y --no-progress
            }
            Add-Content -Path $env:GITHUB_PATH -Value $NsisDir
          }
      - name: Build Windows Portable EXE & NSIS Installer
        shell: pwsh
        run: |
          makensis -VERSION
          go mod tidy
          wails build -skipbindings -clean -platform windows/amd64 -nsis

          New-Item -ItemType Directory -Force -Path release-win | Out-Null
          Copy-Item -Force "build\bin\SSH-Guard-amd64-installer.exe" "release-win\SSH-Guard-Windows-amd64-installer.exe"
          Copy-Item -Force "build\bin\ssh-guard.exe" "release-win\SSH-Guard-Windows-amd64-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-guard-desktop-windows-amd64
          path: release-win/*

  release:
    name: Publish GitHub Release
    needs: [build-web, build-desktop-mac, build-desktop-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "SSH-Guard ${TAG}" \
              --generate-notes
          fi
