name: Build & Release (macOS DMG + Windows EXE + Web)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-web:
    name: Build Offline Web Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Bundle Offline xterm.js
        run: chmod +x scripts/fetch-vendor.sh && ./scripts/fetch-vendor.sh
      - name: Run Unit Tests & Verify Web Dependency Isolation
        run: |
          go test -v -race ./internal/... ./cmd/web/...
          if go list -deps ./cmd/web | grep -q "github.com/egoist/mygo"; then
            echo "ERROR: cmd/web unexpectedly imports github.com/egoist/mygo" >&2
            exit 1
          fi
      - name: Cross-compile Web Edition
        run: |
          mkdir -p dist-web
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist-web/ssh-guard-web-darwin-arm64 ./cmd/web
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist-web/ssh-guard-web-windows-amd64.exe ./cmd/web
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist-web/ssh-guard-web-windows-arm64.exe ./cmd/web
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist-web/ssh-guard-web-linux-amd64 ./cmd/web
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-guard-web-binaries
          path: dist-web/*

  build-desktop-mac:
    name: Build macOS Native Desktop (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Run Tests & MyGo UI Vet
        run: |
          go test -v -race ./...
          go tool mygo vet .
      - name: Build, Verify & Package macOS DMG
        run: |
          chmod +x scripts/fix-mac-gatekeeper.sh
          go tool mygo build -platform darwin/arm64

          APP_PATH="dist/mygo/darwin-arm64/SSH-Guard.app"
          MIN_VER="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP_PATH/Contents/Info.plist")"
          if [ "$MIN_VER" != "13.0" ]; then
            echo "ERROR: expected LSMinimumSystemVersion=13.0, got ${MIN_VER}" >&2
            exit 1
          fi
          test -f "$APP_PATH/Contents/Resources/libghostty-vt.dylib"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          mkdir -p release-mac
          DMG_SRC="$(find dist/mygo/darwin-arm64 -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [ -n "$DMG_SRC" ]; then
            cp -f "$DMG_SRC" release-mac/SSH-Guard-macOS-arm64.dmg
          else
            mkdir -p dmg-stage
            ditto "$APP_PATH" dmg-stage/SSH-Guard.app
            ln -s /Applications dmg-stage/Applications
            hdiutil create -volname "SSH-Guard" -srcfolder dmg-stage -ov -format UDZO release-mac/SSH-Guard-macOS-arm64.dmg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-guard-desktop-macos-arm64
          path: release-mac/SSH-Guard-macOS-arm64.dmg

  build-desktop-windows:
    name: Build Windows Native Desktop (NSIS Installer + Offline Portable EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Run Tests & MyGo UI Vet
        shell: pwsh
        run: |
          go test -v ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go tool mygo vet .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ensure NSIS in PATH
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $NsisDir = "C:\Program Files (x86)\NSIS"
            if (Test-Path (Join-Path $NsisDir "makensis.exe")) {
              Add-Content -Path $env:GITHUB_PATH -Value $NsisDir
            }
          }
      - name: Build Windows NSIS Installer & Offline Single-File Portable EXE
        shell: pwsh
        run: |
          $env:GOFLAGS = "-tags=mygo_nowebview"
          go tool mygo build -platform windows/amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setupExe = Get-ChildItem -Path "dist\mygo\windows-amd64" -Filter "ssh-guard-setup-*-amd64.exe" | Select-Object -First 1
          if (-not $setupExe) {
            throw "Missing Windows NSIS installer under dist\mygo\windows-amd64"
          }
          $dllSrc = "dist\mygo\windows-amd64\ghostty-vt.dll"
          if (-not (Test-Path $dllSrc)) {
            throw "Missing bundled ghostty-vt.dll under dist\mygo\windows-amd64"
          }

          New-Item -ItemType Directory -Force -Path release-win | Out-Null
          Copy-Item -Force $setupExe.FullName "release-win\SSH-Guard-Windows-amd64-installer.exe"

          $embedDir = "internal\desktopui\nativeembed"
          $embedDll = Join-Path $embedDir "ghostty-vt.dll"
          New-Item -ItemType Directory -Force -Path $embedDir | Out-Null
          try {
            Copy-Item -Force $dllSrc $embedDll
            $env:GOFLAGS = "-tags=mygo_nowebview,portable"
            go tool mygo build -platform windows/amd64 -skip-installer -o dist/mygo-portable
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item -Force "dist\mygo-portable\windows-amd64\SSH-Guard.exe" "release-win\SSH-Guard-Windows-amd64-portable.exe"
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $embedDll
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "dist\mygo-portable"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-guard-desktop-windows-amd64
          path: release-win/*

  release:
    name: Publish GitHub Release
    needs: [build-web, build-desktop-mac, build-desktop-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "SSH-Guard ${TAG}" \
              --generate-notes
          fi
